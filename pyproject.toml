[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "kneebench"
version = "0.1.0"
description = "Benchmark harness for battery capacity-fade knee-point detection algorithms"
readme = "README.md"
license = { text = "BSD-3-Clause" }
requires-python = ">=3.9"
dependencies = ["numpy", "pandas", "matplotlib", "scipy"]
authors = [{ name = "Chen Yi", email = "chenyi6758@gmail.com" }]

[project.urls]
Homepage = "https://github.com/chenyi6758-source/kneebench"

[tool.pytest.ini_options]
testpaths = ["tests"]
